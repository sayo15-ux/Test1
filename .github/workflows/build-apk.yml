name: Build APK (PRoot fallback)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and NDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_NDK_HOME="$SDK/ndk/27.0.12077973"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          SDKMANAGER=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/16.0/bin/sdkmanager" "$(command -v sdkmanager || true)"; do
            [ -x "$c" ] && { SDKMANAGER="$c"; break; }
          done
          [ -z "$SDKMANAGER" ] && { echo "::error::no sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          test -d "$SDK/ndk/27.0.12077973"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH" || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug -Dorg.gradle.workers.max=1

      - name: Locate native SigFall libraries
        run: find app/build/intermediates -name 'libsigfall.so' -print || true

      - name: Upload native SigFall libraries
        uses: actions/upload-artifact@v4
        with:
          name: sigfall-native
          path: |
            app/build/intermediates/ndkBuild/debug/obj/local/**/libsigfall.so

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
