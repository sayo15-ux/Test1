name: Native host tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and NDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No Android sdkmanager was found on the runner."
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

          test -d "$SDK/platform-tools"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/ndk/27.0.12077973"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH" || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate shield payload sources
        run: ./gradlew --no-daemon :app:generateShieldPayloads :app:generateFancyPayloads

      - name: Run host C++ tests
        shell: bash
        run: |
          make -C host test
          make -C host shield-tests
          TEST_ROOT="$(mktemp -d)"
          rm -rf "$TEST_ROOT/shield-tests"
          ./host/shield-tests "sample application.apk" "$TEST_ROOT/shield-tests"
