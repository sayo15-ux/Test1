name: Native host tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        shell: bash
        run: |
          sdkmanager --licenses > /dev/null < <(yes) || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate shield payload sources
        run: ./gradlew --no-daemon :app:generateShieldPayloads

      - name: Run host C++ tests
        run: |
          make -C host test
          make -C host shield-tests
          ./host/shield-tests
